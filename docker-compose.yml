services:

  # ============================================
  # Serveur Web Apache + PHP
  # ============================================
  web:
    image: php:8.2-apache
    container_name: smart_trash_web
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./api:/var/www/html/api
      - ./web:/var/www/html/web
      - ./ssl/smart-trash.crt:/etc/ssl/certs/smart-trash.crt
      - ./ssl/smart-trash.key:/etc/ssl/private/smart-trash.key
      - ./apache/ssl.conf:/etc/apache2/sites-enabled/ssl.conf
    depends_on:
      - db
    environment:
      ADMIN_PASSWORD: admin123
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql &&
               a2enmod ssl rewrite &&
               php /var/www/html/api/init_password.php &&
               apache2-foreground"

  # ============================================
  # Base de données MariaDB
  # ============================================
  db:
    image: mariadb:10.6
    container_name: smart_trash_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smart_trash
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/init_user.sql:/docker-entrypoint-initdb.d/2_init_user.sql
      - ./db_data:/var/lib/mysql

  # ============================================
  # Broker MQTT Mosquitto
  # ============================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart_trash_mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ============================================
  # Passerelle MQTT → API
  # ============================================
  passerelle:
    image: python:3.11-slim
    container_name: smart_trash_passerelle
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install paho-mqtt requests -q &&
             python3 passerelle_mqtt.py"
    depends_on:
      - mosquitto
      - web

networks:
  default:
    name: smart_trash_wifi